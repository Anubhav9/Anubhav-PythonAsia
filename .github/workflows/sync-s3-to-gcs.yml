name: Sync S3 To GCS (Manual)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum approved records to evaluate"
        required: true
        default: "200"
      dry_run:
        description: "If true, do not copy objects"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      BUCKET_NAME: approval-letters-python-asia-2026-demo
      GCP_PROJECT_ID: pythonasia-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install boto3 google-cloud-storage

      - name: Sync reports from S3 to GCS
        shell: bash
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python - <<'PY'
          import os
          import boto3
          from botocore.exceptions import ClientError
          from google.cloud import storage

          limit = int(os.getenv("LIMIT", "200"))
          dry_run = os.getenv("DRY_RUN", "false").strip().lower() == "true"
          bucket_name = os.environ["BUCKET_NAME"]
          region = os.environ["AWS_REGION"]

          s3_client = boto3.client("s3", region_name=region)
          gcs_client = storage.Client(project=os.environ["GCP_PROJECT_ID"])
          gcs_bucket = gcs_client.bucket(bucket_name)

          paginator = s3_client.get_paginator("list_objects_v2")
          page_iterator = paginator.paginate(Bucket=bucket_name, Prefix="reports/")

          copied = 0
          skipped = 0
          failed = 0
          checked = 0

          for page in page_iterator:
              for item in page.get("Contents", []):
                  key = item["Key"]
                  if key.endswith("/") or not key.startswith("reports/"):
                      continue

                  checked += 1
                  if checked > limit:
                      break

                  gcs_blob = gcs_bucket.blob(key)
                  if gcs_blob.exists(gcs_client):
                      print(f"[SKIP] Already present in GCS: {key}")
                      skipped += 1
                      continue

                  if dry_run:
                      print(f"[DRY RUN] Would copy {key}")
                      continue

                  try:
                      s3_object = s3_client.get_object(Bucket=bucket_name, Key=key)
                      payload = s3_object["Body"].read()
                      gcs_blob.upload_from_string(payload, content_type="application/pdf")
                      print(f"[COPY] Synced {key}")
                      copied += 1
                  except ClientError as e:
                      print(f"[ERROR] Failed to read {key} from S3: {e}")
                      failed += 1
                  except Exception as e:
                      print(f"[ERROR] Failed to sync {key}: {e}")
                      failed += 1
              if checked >= limit:
                  break

          print("---- Sync Summary ----")
          print(f"Dry run: {dry_run}")
          print(f"S3 objects checked: {checked}")
          print(f"Copied: {copied}")
          print(f"Skipped: {skipped}")
          print(f"Failed: {failed}")
          PY
